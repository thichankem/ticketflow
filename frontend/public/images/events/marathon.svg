<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Marathon and Sports Abstract Cover">
  <defs>
    <linearGradient id="marathon-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="marathon-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="peak-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="peak-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" fill="url(#marathon-sky)"/>

  <!-- Glowing Sun / Energy Orb -->
  <circle cx="860" cy="180" r="90" fill="url(#marathon-sun)" opacity="0.95"/>
  <circle cx="860" cy="180" r="140" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.35"/>

  <!-- Distant Ridge Layers -->
  <path d="M0 440 L180 260 L360 380 L540 180 L760 340 L960 210 L1200 400 V640 H0 Z" fill="url(#peak-1)" opacity="0.75"/>
  <path d="M0 500 L240 360 L440 480 L680 280 L920 440 L1120 320 L1200 460 V640 H0 Z" fill="url(#peak-2)" opacity="0.9"/>
  <path d="M0 570 L320 440 L580 540 L840 410 L1200 560 V640 H0 Z" fill="#042f2e"/>

  <!-- Dynamic Elevation Trail Curves -->
  <path d="M0 520 Q 280 430, 520 490 T 960 370 T 1200 420" fill="none" stroke="url(#trail)" stroke-width="4.5" opacity="0.85"/>
  <path d="M0 560 Q 300 480, 560 530 T 1000 420 T 1200 480" fill="none" stroke="#fde047" stroke-width="2" opacity="0.5"/>
</svg>