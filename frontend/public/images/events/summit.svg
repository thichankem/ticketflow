<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Tech Summit Abstract Cover">
  <defs>
    <linearGradient id="tech-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021b1a"/>
      <stop offset="40%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tech-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="tech-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="tech-radial" cx="75%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#0f766e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#021b1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tech-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" fill="url(#tech-bg)"/>
  <rect width="1200" height="640" fill="url(#tech-radial)"/>

  <!-- Perspective Grid Lines -->
  <g stroke="#14b8a6" stroke-opacity="0.12" stroke-width="1.5">
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="590" x2="1200" y2="590"/>
    <line x1="0" y1="615" x2="1200" y2="615"/>
    <line x1="0" y1="632" x2="1200" y2="632"/>
    <line x1="600" y1="460" x2="0" y2="640"/>
    <line x1="600" y1="460" x2="180" y2="640"/>
    <line x1="600" y1="460" x2="380" y2="640"/>
    <line x1="600" y1="460" x2="600" y2="640"/>
    <line x1="600" y1="460" x2="820" y2="640"/>
    <line x1="600" y1="460" x2="1020" y2="640"/>
    <line x1="600" y1="460" x2="1200" y2="640"/>
  </g>

  <!-- Luminous Abstract Pillars -->
  <rect x="80" y="240" width="48" height="260" rx="12" fill="url(#tech-cyan)" opacity="0.75"/>
  <rect x="150" y="160" width="48" height="340" rx="12" fill="url(#tech-glow)" opacity="0.9"/>
  <rect x="220" y="290" width="48" height="210" rx="12" fill="url(#tech-gold)" opacity="0.85"/>
  <rect x="290" y="190" width="48" height="310" rx="12" fill="#e0e7ff" opacity="0.8"/>
  <rect x="360" y="270" width="48" height="230" rx="12" fill="url(#tech-cyan)" opacity="0.6"/>

  <!-- Floating Glowing Spheres & Rings -->
  <circle cx="860" cy="270" r="210" fill="url(#tech-glow)" opacity="0.22"/>
  <circle cx="860" cy="270" r="160" fill="none" stroke="url(#tech-cyan)" stroke-width="3" stroke-dasharray="16 12" opacity="0.6"/>
  <circle cx="940" cy="190" r="90" fill="url(#tech-cyan)" opacity="0.5"/>
  <circle cx="1010" cy="360" r="60" fill="url(#tech-gold)" opacity="0.65"/>
  <circle cx="760" cy="380" r="36" fill="#38bdf8" opacity="0.7"/>

  <!-- Futuristic Connecting Waveforms -->
  <path d="M420 320 C 560 220, 680 420, 840 280 S 1040 180, 1180 240" fill="none" stroke="#2dd4bf" stroke-width="3.5" opacity="0.5"/>
  <path d="M420 350 C 580 260, 700 460, 860 320 S 1060 220, 1200 280" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35"/>
</svg>