<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Electronic Music & Festival Abstract Cover">
  <defs>
    <linearGradient id="edm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e053a"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#0b0217"/>
    </linearGradient>
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#edm-bg)"/>
  <!-- Laser Arrays & Dynamic Beams -->
  <g stroke="url(#laser)" stroke-width="3" opacity="0.8">
    <line x1="600" y1="640" x2="80" y2="0"/>
    <line x1="600" y1="640" x2="260" y2="0"/>
    <line x1="600" y1="640" x2="480" y2="0"/>
    <line x1="600" y1="640" x2="720" y2="0"/>
    <line x1="600" y1="640" x2="940" y2="0"/>
    <line x1="600" y1="640" x2="1120" y2="0"/>
  </g>
  <circle cx="600" cy="640" r="140" fill="#d946ef" opacity="0.5"/>
  <circle cx="600" cy="640" r="70" fill="#ffffff"/>
</svg>
