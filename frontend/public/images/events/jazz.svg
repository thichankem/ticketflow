<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Jazz and Acoustic Music Abstract Cover">
  <defs>
    <linearGradient id="jazz-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181311"/>
      <stop offset="50%" stop-color="#291e17"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <radialGradient id="amber-glow" cx="72%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#181311" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" fill="url(#jazz-bg)"/>
  <rect width="1200" height="640" fill="url(#amber-glow)"/>

  <!-- Sound Waves & Acoustic Ripples -->
  <g fill="none" stroke="url(#brass-grad)" opacity="0.35">
    <circle cx="820" cy="320" r="80" stroke-width="2"/>
    <circle cx="820" cy="320" r="140" stroke-width="3"/>
    <circle cx="820" cy="320" r="200" stroke-width="2.5" stroke-dasharray="8 6"/>
    <circle cx="820" cy="320" r="260" stroke-width="4"/>
    <circle cx="820" cy="320" r="330" stroke-width="1.5"/>
    <circle cx="820" cy="320" r="410" stroke-width="2" stroke-dasharray="14 10"/>
  </g>

  <!-- Stylized Brass Vinyl Record Core -->
  <circle cx="820" cy="320" r="180" fill="url(#brass-grad)" opacity="0.88"/>
  <circle cx="820" cy="320" r="75" fill="#1c1917"/>
  <circle cx="820" cy="320" r="28" fill="#f59e0b"/>

  <!-- Elegant Curving Melodic Arcs -->
  <path d="M100 240 C 260 140, 320 380, 520 280 S 700 180, 820 320" fill="none" stroke="#fde68a" stroke-width="5" opacity="0.7"/>
  <path d="M140 280 C 300 180, 360 420, 560 320 S 740 220, 820 320" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.5"/>
  <path d="M60 340 C 220 240, 340 460, 520 380 S 720 280, 820 320" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.4"/>
</svg>