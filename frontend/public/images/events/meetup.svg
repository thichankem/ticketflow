<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Community Meetup Abstract Cover">
  <defs>
    <linearGradient id="meetup-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="60%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="community-glow" cx="80%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#15803d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#052e16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#meetup-bg)"/>
  <rect width="1200" height="640" fill="url(#community-glow)"/>
  <!-- Constellation Nodes & Connecting Links -->
  <g stroke="url(#node-line)" stroke-width="2.5" opacity="0.45">
    <line x1="160" y1="280" x2="320" y2="180"/>
    <line x1="320" y1="180" x2="520" y2="240"/>
    <line x1="520" y1="240" x2="680" y2="160"/>
    <line x1="680" y1="160" x2="880" y2="280"/>
    <line x1="880" y1="280" x2="1040" y2="200"/>
    <line x1="320" y1="180" x2="420" y2="380"/>
    <line x1="520" y1="240" x2="620" y2="420"/>
    <line x1="680" y1="160" x2="800" y2="380"/>
    <line x1="880" y1="280" x2="940" y2="440"/>
  </g>
  <circle cx="160" cy="280" r="14" fill="#86efac" opacity="0.8"/>
  <circle cx="320" cy="180" r="22" fill="#4ade80" opacity="0.9"/>
  <circle cx="520" cy="240" r="18" fill="#a7f3d0" opacity="0.85"/>
  <circle cx="680" cy="160" r="26" fill="#34d399" opacity="0.9"/>
  <circle cx="880" cy="280" r="32" fill="#86efac" opacity="0.95"/>
  <circle cx="1040" cy="200" r="16" fill="#4ade80" opacity="0.75"/>
  <circle cx="420" cy="380" r="20" fill="#a7f3d0" opacity="0.7"/>
  <circle cx="620" cy="420" r="24" fill="#34d399" opacity="0.85"/>
  <circle cx="800" cy="380" r="28" fill="#4ade80" opacity="0.8"/>
  <circle cx="940" cy="440" r="18" fill="#86efac" opacity="0.7"/>
</svg>
